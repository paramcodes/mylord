pre-commit:
  parallel: true
  commands:
    format:
      glob: "*.{ts,tsx,js,jsx,json,css}"
      run: bunx oxfmt --check {staged_files}
    lint:
      glob: "*.{ts,tsx,js,jsx}"
      run: bunx oxlint {staged_files}
    typecheck:
      run: bun run typecheck
pre-push:
  commands:
    test:
      run: bun run test
    build:
      run: bun run build
